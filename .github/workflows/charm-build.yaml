name: Build/Test Charm

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: charm/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r charm/requirements-dev.txt
      - name: Run linters
        run: |
          cd charm
          python -m ruff check src tests
          python -m ruff format --check src tests

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: charm/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r charm/requirements-dev.txt
      - name: Run offline tests and verify vendored library pins
        run: |
            cd charm
            python -m pytest -q --cov=charm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./charm/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  pack:
    name: Pack standalone sidecar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - lint
      - unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic --channel=4.x/stable
      - name: Pack on disposable runner (no deploy or publish)
        run: |
            cd charm
            sudo charmcraft pack --destructive-mode --platform amd64
      - name: Upload local charm artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-center-ratings_amd64
          path: charm/app-center-ratings_amd64.charm
          if-no-files-found: error
