name: ratings
version: 0.0.4
license: GPL-3.0

base: bare
build-base: ubuntu@24.04
platforms:
  amd64:

summary: Ubuntu App Ratings Service
description: |
  Backend service to support application ratings in the new Ubuntu Software Centre.
run-user: _daemon_

services:
  ratings:
    override: replace
    startup: enabled
    command: "/bin/ratings"

parts:
  ratings:
    plugin: rust
    build-packages:
      - libssl-dev
      - pkg-config
    build-snaps:
      - protobuf
    source: .
    stage-packages:
      - libc6_libs
      - libgcc-s1_libs
      - libssl3t64_libs
      - ca-certificates_data

  migrations:
    plugin: dump
    source: ./sql/
    organize:
        migrations : sql/migrations
