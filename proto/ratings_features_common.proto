syntax = "proto3";

package ratings.features.common;

message Rating {
  string snap_id = 1;
  uint64 total_votes = 2;
  RatingsBand ratings_band = 3;
  string snap_name = 4;
}

message ChartData {
  float raw_rating = 1;
  Rating rating = 2;
}

// The packaging format an App is distributed in.
//
// PACKAGE_TYPE_SNAP is deliberately the zero value so that clients which
// predate this field keep their snap semantics (see docs/adr/0001-package-type-defaults-to-snap.md).
enum PackageType {
  PACKAGE_TYPE_SNAP = 0;
  PACKAGE_TYPE_DEB = 1;
}

enum RatingsBand {
  VERY_GOOD = 0;
  GOOD = 1;
  NEUTRAL = 2;
  POOR = 3;
  VERY_POOR = 4;
  INSUFFICIENT_VOTES = 5;
}
