project: app-center-ratings
path: /home/ubuntu/proj
kill-timeout: 90m
warn-timeout: 5m
backends:
  integration-test:
    type: integration-test
    systems:
      - ubuntu-24.04:
          runner: [ubuntu-24.04]
          cpu: 4
          memory: 8
          disk: 30
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-14b1cf49d48b9d5b96192d9bca2890c98b7295cf}")'
exclude:
  - .git
  - .tox
  - .venv
  - .python-lab
  - .*_cache
  - target
  - ratings_rock/target
  - dev/build
integration-suites:
  tests/integration/:
    summary: Ratings charm and rock integration tests
    working-dir: ./
    backends:
      - integration-test
