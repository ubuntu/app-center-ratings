[package]
name = "ratings"
version = "0.1.0"
edition = "2021"

[features]
# Used to prevent tests that need a running DB from executing unless explicitly requested
# Annotate such tests with the following:
#   #[cfg_attr(not(feature = "db_tests"), ignore)]
#
# Execute the tests using "cargo test --features db_tests"
db_tests = []

# Used to skip caching of rating data in integration tests
skip_cache = []

[dependencies]
cached = { version = "4.1.1", features = ["async"] }
dotenvy = "0.15"
envy = "0.4"
futures = "0.3"
http = "1.1.0"
jsonwebtoken = "12.0"
prost = "0.14.6"
prost-types = "0.14.6"
reqwest = "0.13"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.114"
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "migrate", "time"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.40.0", features = ["full"] }
tonic = { version = "0.12.2", features = ["tls"] }
tonic-reflection = "0.14.9"
tower = "0.5.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
anyhow = "1.0.93"
futures = "0.3"
rand = "0.10"
sha2 = "0.11"
simple_test_case = "1.2.0"

[build-dependencies]
tonic-build = { version = "0.13", features = ["prost"] }
