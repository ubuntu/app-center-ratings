# Migrated from machine-charm environments to locked sidecar checks.

[tox]
no_package = True
skip_missing_interpreters = True
env_list = lint, unit
min_version = 4.0.0

[testenv]
deps = -r {tox_root}/requirements-dev.txt
change_dir = {tox_root}

[testenv:format]
description = Apply Ruff fixes and formatting using the locked development tools
commands =
    ruff check --fix src tests
    ruff format src tests

[testenv:lint]
description = Check sidecar code with the locked Ruff and pyproject.toml configuration
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:unit]
description = Run offline sidecar pytest tests with coverage
commands =
    python -m pytest -q --cov=charm --cov-report=term-missing --cov-report=xml:coverage.xml {posargs}
